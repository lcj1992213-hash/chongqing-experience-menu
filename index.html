  <script>
    const themes=[
      {n:"01",num:"①",name:{en:"Local Life",yue:"市井煙火"},desc:{en:"Slow down over tea, conversation and the unhurried rituals that make Chongqing feel lived-in rather than simply visited.",yue:"由一杯茶、一局麻雀同街坊日常開始，慢慢感受真正有人生活、而唔只係俾人打卡嘅重慶。"}},
      {n:"02",num:"②",name:{en:"Mountain Streets",yue:"山城老街"},desc:{en:"Climb through the city’s vertical memory: shaded lanes, century-old traces and neighborhoods where ordinary life still sets the pace.",yue:"沿住山勢向上行，穿過樹蔭老巷、百年遺跡同依然照自己節奏生活嘅社區，讀懂山城嘅垂直記憶。"}},
      {n:"03",num:"③",name:{en:"The 8D City",yue:"8D 魔幻"},desc:{en:"Roads loop in mid-air, trains cross buildings and neon descends underground — Chongqing at its most cinematic and improbable.",yue:"公路喺半空打圈、輕軌穿樓、霓虹一路落到地底：呢個係最似電影、最不可思議嘅重慶。"}},
      {n:"04",num:"④",name:{en:"Two Rivers After Dark",yue:"兩江夜景"},desc:{en:"An evening-only chapter, designed around the rivers, the skyline and — when scheduled — thousands of lights moving above the city.",yue:"只屬於夜晚嘅一章：沿江散步、望住天際線食飯；遇上官方場次，再睇萬點燈光喺城市上空流動。"}},
      {n:"05",num:"⑤",name:{en:"Above the Skyline",yue:"高空俯瞰"},desc:{en:"See how the mountain, rivers and towers lock together — from a quiet hillside panorama or out on the edge of the skyline itself.",yue:"由安靜山腰到真正踏出天際線邊緣，睇清楚山、兩江同高樓點樣扣埋成一座立體城市。"}},
      {n:"06",num:"⑥",name:{en:"Architecture & Memory",yue:"建築人文"},desc:{en:"Ancient belief, wartime memory and contemporary city life meet in places best understood through context rather than a quick glance.",yue:"古老信仰、陪都記憶同當代城市生活喺同一空間相遇；先有脈絡，再去睇，先會真正明白。"}},
      {n:"07",num:"⑦",name:{en:"Countryside & Nature",yue:"郊外一日"},desc:{en:"Give a full day to Chongqing's countryside: monumental karst landscapes, forested mountains, old river towns and restorative hot springs.",yue:"用完整一日走出主城：睇巨型喀斯特地貌、坐纜車上山、行舊河鎮，再用一池溫泉慢慢收尾。"}}
    ];
    const experiences=[
      {id:"jiaotong",t:0,q:"Chongqing Jiaotong Tea House old artist sketch",title:{en:"Tea, Sketches & an Old Master",yue:"交通茶館與老畫家交流"},d:"1.5h",season:{en:"Year-round",yue:"全年"},tags:{en:["Local life","Tea","Art"],yue:["街坊生活","茶文化","藝術"]},p:{en:["Begin with tea and the everyday rhythm of one of Chongqing’s most characterful old teahouses. Then meet Mr. Chen, who has spent three decades sketching here, creating work and helping protect the place and its community.","Through his stories, the tea drinkers and weathered room become a living portrait of the city rather than a nostalgic set."],yue:["先坐低飲杯茶，感受重慶老茶館最自然嘅日常節奏。之後由陳老師分享佢三十年來喺度寫生、創作，同守護茶館及老茶客嘅經歷。","有咗佢嘅故事，眼前嘅老茶客同斑駁空間就唔再係懷舊佈景，而係一幅仲活緊嘅城市肖像。"]},h:{en:["Hear the stories behind the teahouse, its regulars and Mr. Chen’s work","Try a simple comic-style sketch in the real teahouse setting","Take home the finished sketch, signed by the artist"],yue:["聽陳老師講茶館、老茶客同作品背後嘅故事","喺真實老茶館入面試畫一段簡單漫畫速寫","由老師簽名，將親手完成嘅作品帶走"]}},
      {id:"mahjong",t:0,q:"Chongqing traditional teahouse mahjong locals",title:{en:"Tea & Mahjong with a Local Teacher",yue:"江陵茶館品茶學打麻雀"},d:"1.5h",season:{en:"Year-round",yue:"全年"},tags:{en:["Local life","Mahjong","Tea"],yue:["街坊生活","麻雀","品茶"]},p:{en:["Settle into Jiangling Teahouse for a tasting of local tea before the tiles come out. A patient local teacher introduces the rhythm, etiquette and essential rules of mahjong in a relaxed, social setting.","The pleasure is less about winning than joining a language of gestures and table talk shared across generations."],yue:["先喺江陵茶館慢慢品茶，再由一位有耐性嘅本地老師開枱，講解重慶人打麻雀嘅節奏、禮數同基本玩法。","重點唔係一定要贏，而係參與一套跨越幾代人、由手勢同枱邊閒談組成嘅共同語言。"]},h:{en:["A gentle introduction suitable for complete beginners","Learn the social codes around a local mahjong table","Best enjoyed as a convivial pause rather than a formal lesson"],yue:["完全未玩過都適合，節奏輕鬆","認識本地麻雀枱上嘅社交規矩","當成一段有人情味嘅停頓，而唔係正式課堂"]}},
      {id:"eling-testbed",t:0,q:"Chongqing Eling Park Testbed 2 sunset view",title:{en:"Eling Park & Testbed 2",yue:"鵝嶺公園與二廠"},d:"2–3h",season:{en:"Clear afternoons",yue:"天朗嘅下晝"},tags:{en:["People watching","Sunset","Creative district"],yue:["觀察街坊","日落","文創空間"]},p:{en:["People-watch in leafy Eling Park, then climb Kansheng Tower for a broad reading of Chongqing’s geography. The half-cliff boardwalk catches beautiful late light and gives a calmer, top-down view of the Liziba monorail.","Continue into Testbed 2, a former Republican-era banknote-printing complex now dotted with small cafés and creative spaces."],yue:["先喺綠蔭下嘅鵝嶺公園睇下街坊日常，再上瞰勝樓一次過讀清重慶嘅地勢。半山崖棧道黃昏光線好靚，亦係由上而下睇李子壩輕軌嘅舒服位置。","之後行入二廠：由民國印鈔廠遺址變成嘅文創區，幾間細咖啡店各有氣氛。"]},h:{en:["A relaxed local park before the panoramic reveal","Our preferred, less crowded Liziba viewpoint","Reach the boardwalk before sunset"],yue:["先有公園日常，再慢慢揭開全景","我哋較推薦、冇咁迫嘅李子壩觀景角度","預鬆少少時間，日落前行到棧道"]}},
      {id:"yuzhong",t:1,q:"Chongqing Shibati Shancheng Trail old street steps",title:{en:"The Yuzhong Ascent",yue:"渝中老城向上行"},d:"3–3.5h",season:{en:"Spring & autumn",yue:"春秋最舒服"},tags:{en:["Walking","Old city","Local neighborhoods"],yue:["徒步","老城","街坊社區"]},p:{en:["A bottom-to-top walk through Shibati, the Mountain City Trail, Linhua Road and Zaozilan'ya Trail. Shibati is the polished, commercial prologue; the route becomes quieter and more revealing as it climbs.","The essence lies around Linhua Road and Zaozilan'ya — yellow ficus trees, elderly residents with hand fans and almost no visitors. The trail also hides the remains of a French Catholic charitable institution founded in 1902."],yue:["由十八梯開始，自下而上穿過山城巷／山城步道、臨華路，再到棗子嵐埡步道。十八梯比較商業化，當作序章簡單睇；越向上行，老城先越安靜、越有內容。","真正精華喺臨華路同棗子嵐埡一帶：成街黃葛樹、搖蒲扇嘅老人家，幾乎冇遊客。途中仲藏住一處始於 1902 年嘅法國仁愛堂遺址。"]},h:{en:["A steady uphill route with stairs","Spend less time at commercial Shibati and more in the upper lanes","Designed for texture and observation, not landmark collecting"],yue:["全程向上兼有梯級，鞋一定要舒服","十八梯簡單睇，把時間留俾上面啲老巷","重點係質感同觀察，唔係逐個地標打卡"]}},
      {id:"south-bank",t:1,q:"Chongqing Xiahaoli Longmenhao old street Nan'an",title:{en:"South Bank Old Streets",yue:"南岸老街慢行"},d:"1.5–2h",season:{en:"Late afternoon",yue:"下晝後段"},tags:{en:["Walking","Architecture","River views"],yue:["漫步","建築","江景"]},p:{en:["Link Xiahaoli with Longmenhao for a compact walk through the South Bank’s sloping lanes, old façades and framed river views.","Xiahaoli is photogenic but now more commercial and crowded. We would give more time to Longmenhao, where the pace is calmer and the architecture has room to breathe."],yue:["將下浩里同龍門浩串成一段精簡步行，沿南岸斜巷睇老立面，同被建築框住嘅江景。","下浩里上鏡，但而家較商業化亦多人；我哋會建議將多啲時間留俾龍門浩，節奏更靜，建築亦有空間慢慢睇。"]},h:{en:["Longmenhao is our preferred focus","Xiahaoli works best as a brief visual introduction","Pairs well with an early evening on Nanbin Road"],yue:["我哋會以龍門浩做重點","下浩里適合當短小嘅視覺序章","可以順住接去南濱路嘅黃昏行程"]}},
      {id:"sujiaba",t:2,q:"Chongqing Sujiaba interchange spiral road aerial",title:{en:"A Loop through Sujiaba",yue:"蘇家壩立交繞城一圈"},d:"30 min",season:{en:"Year-round",yue:"全年"},tags:{en:["Urbanism","Drive-by","8D city"],yue:["城市規劃","途經體驗","8D 山城"]},p:{en:["Drive the extraordinary spiral of Sujiaba Interchange, then pause at the viewing platform to understand the road you have just traced in the air.","It is a brilliant piece of mountain-city engineering, but best treated as an atmospheric stop en route rather than a destination that consumes the day."],yue:["先坐車沿蘇家壩立交盤旋一圈，再喺觀景台停一停，回望自己啱啱喺半空走過嘅路。","呢度係山城工程好精彩嘅一筆，但最適合順路經過，唔需要專登佔用太多時間。"]},h:{en:["Recommended as a pass-through stop","The drive and overlook work as one sequence","Short, graphic and distinctly Chongqing"],yue:["建議當作順路停靠點","車行體驗同觀景台要連住先完整","短、俐落，而且非常重慶"]}},
      {id:"liziba",t:2,q:"Chongqing Liziba monorail through building view",title:{en:"Liziba, from Above",yue:"由鵝嶺俯看李子壩"},d:"Brief stop",season:{en:"Clear daylight",yue:"日間天朗"},tags:{en:["Monorail","Viewpoint","Urban layers"],yue:["輕軌","觀景","立體城市"]},p:{en:["The famous monorail-through-a-building moment is more legible — and more elegant — from Eling Park’s half-cliff boardwalk above.","We do not recommend joining the dense crowd at the official street-level viewing platform. A short, well-placed pause from above says more with far less friction."],yue:["喺鵝嶺公園半山崖棧道由上而下望，輕軌穿樓嘅關係反而睇得更清楚、畫面亦更靚。","我哋唔建議落去官方觀景台同人迫；由上面揀啱位置短停，舒服得多，亦更能讀懂城市層次。"]},h:{en:["Avoid the crowded official platform","Fold into the Eling Park experience","Allow a few trains to pass for the full rhythm"],yue:["避開擠迫嘅官方觀景台","同鵝嶺公園體驗一齊安排","等兩三班車經過，先感受到完整節奏"]}},
      {id:"kuixinglou",t:2,q:"Chongqing Kuixinglou skybridge night city layers",title:{en:"Kuixinglou, Seen Not Entered",yue:"魁星樓：遠觀就好"},d:"Brief stop",season:{en:"After dark",yue:"入夜之後"},tags:{en:["Night view","Urban layers","Short stop"],yue:["夜景","立體城市","短停"]},p:{en:["Kuixinglou is one of Chongqing’s neatest demonstrations of ‘ground level’ turning into the 22nd floor. Yet the most persuasive experience is the layered city after dark, not a busy daytime visit inside.","We would keep this brief and let the wider night skyline — from the Jiangbeizui riverbank or a river cruise — carry the drama."],yue:["魁星樓最有趣係同一個『地下』轉眼變成二十二樓，但真正有說服力嘅其實係入夜後整座城市嘅層次，而唔係日頭入去同人迫。","我哋會將呢站留得好短，再由江北嘴江灘或者遊船，睇整個夜景去完成戲劇感。"]},h:{en:["Not recommended as a daytime interior visit","Keep the stop short","Let a wider night viewpoint provide the context"],yue:["唔建議日頭入內參觀","短停就夠","交俾更闊嘅夜景角度補足脈絡"]}},
      {id:"deyi",t:2,q:"Chongqing Deyi World neon cyberpunk nightlife underground",title:{en:"Deyi World after Dark",yue:"得意世界霓虹夜行"},d:"2h",season:{en:"Evenings",yue:"夜晚"},tags:{en:["Cyberpunk","Nightlife","Street photography"],yue:["賽博朋克","夜生活","街頭攝影"]},p:{en:["Descend into the layered alleys and underpasses of Deyi World, where old entertainment streets, concrete megastructures and neon signage form the closest thing to a real cyberpunk film set.","Go after dark and let the sequence unfold from street level to below ground. The appeal is atmosphere — not a single landmark."],yue:["一路落入得意世界嘅巷道同地下空間：舊娛樂街、巨型混凝土結構同霓虹招牌疊埋一齊，幾乎就係現實版賽博朋克片場。","一定要入夜先去，慢慢由街面行落地底。吸引人嘅唔係一個地標，而係成段氣氛點樣逐層展開。"]},h:{en:["The strongest cyberpunk chapter in the menu","Designed specifically for after dark","A two-hour atmospheric walk rather than a checklist"],yue:["成個菜單入面最完整嘅賽博朋克篇章","專為入夜後設計","兩小時沉浸式慢行，唔係打卡清單"]}},
      {id:"drone",t:3,q:"Chongqing drone light show Nanbin Road night skyline",title:{en:"A Drone-Show Evening",yue:"無人機表演之夜"},d:"2–2.5h",season:{en:"Scheduled Saturdays",yue:"按官方公布嘅星期六"},tags:{en:["Drone show","Dinner","River walk"],yue:["無人機表演","晚餐","沿江散步"]},p:{en:["The recommended sequence is a walk along Nanbin Road, dinner at Changjiahui, then a front-facing view of the drone show over the confluence. This turns a large public spectacle into a composed evening rather than a single crowded stop.","Recent official schedules place regular Saturday performances at 20:30, but weather and special arrangements can change or cancel a show. E&B will reconfirm shortly before travel."],yue:["我哋最推薦嘅次序係：南濱路散步、長嘉匯食晚飯，再正面睇兩江上空嘅無人機表演。咁樣一場大型公眾活動，就會變成一個有鋪排嘅晚上。","近期官方排期一般係星期六 20:30，但天氣同特別安排都有機會令場次更改或取消。E&B 會喺出發前再次確認。"]},h:{en:["Nanbin Road walk → Changjiahui dinner → show","Front-facing view when access conditions allow","Schedule must be reconfirmed close to travel"],yue:["南濱路散步 → 長嘉匯晚餐 → 表演","視乎人流同管制，安排較正面嘅角度","臨行前一定再確認官方場次"]}},
      {id:"night-view",t:3,q:"Chongqing Nanbin Road night panoramic skyline river",title:{en:"The Pure Chongqing Night View",yue:"只為兩江夜景而來"},d:"2–2.5h",season:{en:"Clear evenings",yue:"天朗夜晚"},tags:{en:["Skyline","Dinner","Two rivers"],yue:["天際線","晚餐","兩江"]},p:{en:["Without the drone show, the evening can become quieter and more elegant. Choose dinner along Nanbin Road or at a carefully selected mid-mountain viewpoint, then allow the rivers and illuminated skyline to hold the attention.","The advantage is flexibility: chase the clearest view, avoid the largest crowds and linger over dinner rather than a fixed showtime."],yue:["如果唔睇無人機，成晚反而可以更安靜、更從容。可以揀南濱路或者半山觀城台附近食晚飯，將注意力完整留俾兩江同亮燈後嘅天際線。","好處係彈性大：可以跟能見度揀最好角度、避開最大人潮，亦唔使追固定開場時間。"]},h:{en:["A calmer alternative to show night","Dinner with a Nanbin Road or mid-mountain view","More flexibility around weather and crowds"],yue:["比表演夜更從容嘅選擇","南濱路或半山觀城角度食晚飯","可以因應天氣同人流靈活調整"]}},
      {id:"eling-panorama",t:4,q:"Chongqing Eling Park Kansheng Tower panoramic skyline",title:{en:"Eling’s Panoramic Reveal",yue:"鵝嶺棧道與瞰勝樓"},d:"1–1.5h",season:{en:"Clear late afternoon",yue:"天朗黃昏前"},tags:{en:["Panorama","Sunset","Gentle walk"],yue:["全景","日落","輕鬆步行"]},p:{en:["From the half-cliff boardwalk to Kansheng Tower, Eling offers one of the most intelligible views of Chongqing: the rivers, ridges, bridges and towers read as a single landscape.","It is particularly good in the final light of the day, with enough foreground life to keep the panorama from feeling like a sealed observation deck."],yue:["由半山崖棧道行到瞰勝樓，鵝嶺提供咗一個最好理解重慶嘅角度：兩江、山脊、橋同高樓終於連成一幅完整地景。","日落前最後一段光尤其靚，而且前景仲有公園生活，唔會似封閉觀景台咁只剩下一幅遠景。"]},h:{en:["Our gentler skyline option","Best timed before sunset","Can combine with Testbed 2 and Liziba-from-above"],yue:["較輕鬆舒服嘅天際線選擇","最好日落前去","可以同二廠及俯看李子壩一齊安排"]}},
      {id:"raffles",t:4,q:"Chongqing Raffles City cloud walk skywalk high altitude",title:{en:"Raffles Cloud Walk",yue:"來福士雲端漫步"},d:"30 min",season:{en:"Clear, calm weather",yue:"天朗風細"},tags:{en:["High altitude","Adrenaline","Modern skyline"],yue:["高空","刺激體驗","現代天際線"]},p:{en:["Step out above the meeting of the rivers for a high-altitude walk around Chongqing Raffles City. Harnesses, professional equipment and staff guidance provide the safety framework throughout.","This is the menu’s adrenaline choice: short, controlled and best suited to guests who genuinely enjoy height and a little exposure."],yue:["喺兩江交匯上空踏出來福士，沿高空路線近距離感受重慶天際線。全程會有安全帶、專業裝備同工作人員指引。","呢個係菜單入面最刺激嘅選擇：時間短、控制完善，最適合真係享受高度同少少離地感嘅客人。"]},h:{en:["Full safety equipment and staff supervision","For confident guests who enjoy heights","Weather dependent; a gentler option can be substituted"],yue:["配備完整安全裝置並有職員看顧","適合唔怕高、鍾意刺激嘅客人","受天氣影響，可改成較溫和觀景選擇"]}},
      {id:"luohan",t:5,q:"Chongqing Luohan Temple skyscrapers Buddhist architecture",title:{en:"Luohan Temple & Coffee",yue:"羅漢寺與一杯咖啡"},d:"1–1.5h",season:{en:"Year-round",yue:"全年"},tags:{en:["Architecture","Buddhism","City contrast"],yue:["建築","佛教","古今對照"]},p:{en:["Enter a working Buddhist temple almost hidden among central Chongqing’s towers. Incense, carved stone and intimate courtyards create a striking pause inside one of China’s most vertical commercial districts.","Follow with coffee nearby and a conversation about belief and commerce, compressed history and the modern city sharing the same few streets."],yue:["走入一座幾乎被市中心高樓藏起來、至今仍然運作嘅佛寺。香火、石刻同細小院落，喺中國最立體嘅商業區入面形成一段突然安靜嘅停頓。","之後喺附近飲杯咖啡，慢慢傾下信仰同商業、壓縮咗嘅歷史同現代城市，點樣喺幾條街之內共存。"]},h:{en:["A vivid old-and-new architectural contrast","Short enough to fold into a central-city day","Coffee creates time to unpack what has just been seen"],yue:["古今建築對照非常鮮明","時間精簡，容易放入市中心行程","睇完再用一杯咖啡留時間消化"]}},
      {id:"dazu",t:5,q:"Dazu Rock Carvings Baodingshan Chongqing Buddhist sculptures",title:{en:"Dazu, Image before Original",yue:"大足石刻：先理解，再見真跡"},d:"10h",season:{en:"Spring & autumn",yue:"春秋最舒服"},tags:{en:["UNESCO","Buddhist art","Full day"],yue:["世界遺產","佛教藝術","全日"]},p:{en:["Begin with two digital films: an immersive 8K dome presentation that magnifies the carvings and spatial composition, followed by a 4K widescreen film on their history and making.","Continue through the museum, then enter Baodingshan to meet the originals. For international guests, image → context → object transforms a vast wall of sculpture into stories they can actually read."],yue:["先睇兩套數字影像：8K 球幕將石刻細節同整體空間放大；4K 寬銀幕就講歷史同開鑿過程。","之後再入博物館，最後先到寶頂山見真跡。尤其對外國客人，『影像 → 脈絡 → 真跡』會令一大片石刻真正變成讀得明嘅故事。"]},h:{en:["8K dome → 4K history film → museum → Baodingshan originals","A full interpretation-led day","Sequenced for first-time international visitors"],yue:["8K 球幕 → 4K 歷史影片 → 博物館 → 寶頂山真跡","以理解為主嘅完整一日","次序特別照顧第一次接觸石刻嘅外國客人"]}},
      {id:"wulong",t:6,q:"Wulong Three Natural Bridges Chongqing karst canyon",title:{en:"Wulong & the Wu River",yue:"武隆天生三橋與烏江"},d:"10h",season:{en:"Apr–Jun · Sep–Nov",yue:"4–6 月 · 9–11 月"},tags:{en:["Karst landscape","Nature","Full day"],yue:["喀斯特地貌","自然","全日"]},p:{en:["Give a full day to Wulong’s Three Natural Bridges, where colossal limestone arches, sinkholes and deep green walls make human scale feel suddenly small.","On the journey, add the Fuling Wu River viewpoint when conditions and routing allow, letting the transition from metropolis to geology become part of the experience."],yue:["用完整一日去武隆天生三橋。巨型石灰岩天橋、天坑同深綠崖壁，會令人突然感受到自己喺地貌面前有幾細。","路線同天氣許可嘅話，途中加停涪陵烏江觀景台，用一幅開闊江景打斷車程，亦令由大城市走入地質世界嘅轉換本身成為體驗。"]},h:{en:["Three Natural Bridges as the main event","Fuling Wu River viewpoint en route when practical","A long day with substantial driving and walking"],yue:["天生三橋係全日主角","路況合適就順路加入涪陵烏江觀景台","車程同步行都較多，係完整長日"]}},
      {id:"beibei",t:6,q:"Chongqing Beibei Jinyun Mountain hot spring old town",title:{en:"Beibei, Mountain to Hot Spring",yue:"北碚：由縉雲山到溫泉"},d:"10h",season:{en:"Autumn–spring",yue:"秋季至春季"},tags:{en:["Mountain","Hot spring","Old town"],yue:["山林","溫泉","古鎮"]},p:{en:["Ride the cable car into the green slopes of Jinyun Mountain, then trace Beibei’s long relationship with restorative water through the Northern Hot Spring area and a refined Bolian hot-spring experience.","Finish among the stone lanes and river memories of Jingangbei Old Town. The day is deliberately balanced: fresh air, local history and an unhurried final soak."],yue:["坐纜車上縉雲山，先吸一口山林空氣；再由北溫泉一帶一路認識北碚同溫泉嘅長久關係，最後安排較精緻嘅柏聯溫泉體驗。","中間或者尾段穿過金剛碑古鎮嘅石巷同河邊記憶。成日刻意做到有平衡：山林、地方歷史，再用一段唔趕時間嘅浸浴收尾。"]},h:{en:["Jinyun Mountain cable car","Northern Hot Spring heritage and Bolian experience","Jingangbei Old Town for texture and local memory"],yue:["縉雲山纜車","北溫泉歷史加柏聯溫泉體驗","金剛碑古鎮嘅質感同地方記憶"]}}

      jiaotong:{title:"交通茶馆与老画家交流",season:"全年",tags:["本地生活","茶文化","艺术"],p:["先在交通茶馆坐下喝茶，感受重庆老茶馆的日常节奏；随后由陈老师分享他三十年来在这里写生、创作并守护茶馆与老茶客的经历。","听过这些故事，眼前的老茶客与斑驳空间便不再只是怀旧背景，而是一幅仍在发生的城市肖像。"],h:["听陈老师讲茶馆、老茶客与作品背后的故事","在真实老茶馆里尝试一段简单漫画速写","由老师签名，带走亲手完成的作品"]},
      mahjong:{title:"江陵茶馆品茶学麻将",season:"全年",tags:["本地生活","麻将","品茶"],p:["先在江陵茶馆慢慢品茶，再由一位耐心的本地老师开桌，介绍重庆麻将的节奏、礼数与基本玩法。","重点不在输赢，而在于加入一套由手势、桌边谈笑与代际记忆组成的共同语言。"],h:["完全没有经验也适合","认识本地麻将桌上的社交规则","把它当作一次有人情味的停顿，而非正式课堂"]},
      "eling-testbed":{title:"鹅岭公园与二厂",season:"晴朗午后",tags:["观察本地生活","日落","文创空间"],p:["先在绿荫下的鹅岭公园看看本地人的日常，再上瞰胜楼理解重庆地势。半山崖栈道适合看日落，也能从上方安静地观察李子坝轻轨。","随后走进二厂——由民国时期印钞厂遗址改造的文创区域，小型咖啡店各有气氛。"],h:["先有公园日常，再逐步展开城市全景","我们更推荐、也更从容的李子坝视角","预留时间在日落前到达栈道"]},
      yuzhong:{title:"渝中老城拾级而上",season:"春秋最佳",tags:["步行","老城","本地社区"],p:["从十八梯出发，自下而上经过山城巷、山城步道、临华路，最后到枣子岚垭步道。十八梯较商业化，可作为简短序章；越往上，老城越安静。","精华在临华路与枣子岚垭一带：满街黄葛树、摇蒲扇的老人，几乎没有游客；途中还藏着始建于 1902 年的法国仁爱堂遗址。"],h:["全程向上并包含较多台阶","十八梯简看，把时间留给上段老巷","重点是城市质感与观察，而非收集地标"]},
      "south-bank":{title:"南岸老街漫步",season:"午后至黄昏",tags:["步行","建筑","江景"],p:["把下浩里与龙门浩连接成一段紧凑步行，沿南岸坡巷看老建筑立面和被街巷框住的江景。","下浩里上镜但更商业、游客也更多；我们建议把更多时间留给龙门浩，让建筑与步行节奏都更从容。"],h:["以龙门浩作为重点","下浩里适合作为简短视觉序章","可自然衔接南滨路黄昏行程"]},
      sujiaba:{title:"苏家坝立交环行",season:"全年",tags:["城市工程","途经体验","8D 山城"],p:["乘车沿苏家坝立交盘旋一圈，再在观景台短暂停留，回望刚刚在半空中走过的道路。","这是山城工程非常精彩的一笔，但最适合顺路体验，不必单独占用太多时间。"],h:["建议作为途经停靠点","车行体验与观景台应连成一个完整段落","短、清晰，而且非常重庆"]},
      liziba:{title:"从鹅岭俯瞰李子坝",season:"晴朗白天",tags:["轻轨","观景","立体城市"],p:["从鹅岭公园半山崖栈道向下看，轻轨穿楼的空间关系反而更清楚，画面也更完整。","不建议加入街面官方观景台的拥挤人群；在上方选好位置短停，舒适许多，也更能理解城市层次。"],h:["避开拥挤的官方观景台","与鹅岭公园体验一起安排","等两三班轻轨经过，感受完整节奏"]},
      kuixinglou:{title:"魁星楼：远观即可",season:"入夜之后",tags:["夜景","城市层次","短停"],p:["魁星楼最有趣的是同一处“地面”转眼变成二十二楼；但真正有说服力的是入夜后的城市层次，而不是白天进入内部。","我们会把这一站控制得很短，再从江北嘴江滩或游船上，用更完整的夜景补足戏剧感。"],h:["不建议白天入内参观","短暂停留即可","用更开阔的夜景视角补足脉络"]},
      deyi:{title:"得意世界霓虹夜行",season:"夜晚",tags:["赛博朋克","夜生活","街头摄影"],p:["沿得意世界的巷道与地下空间逐层下降：旧娱乐街、巨型混凝土结构和霓虹招牌叠在一起，接近现实版赛博朋克片场。","一定要入夜后前往，并让路线从街面慢慢展开到地下；吸引力来自整段氛围，而不是某一个地标。"],h:["菜单中最完整的赛博朋克篇章","专为入夜后设计","两小时沉浸式慢行，而非打卡清单"]},
      drone:{title:"无人机表演之夜",season:"按官方公布的周六场次",tags:["无人机表演","晚餐","沿江散步"],p:["推荐顺序是南滨路散步、长嘉汇晚餐，再正面观看两江上空的无人机表演，让大型公共活动变成一段有铺排的完整夜晚。","近期常态场次通常安排在周六晚间，但天气和特殊安排可能导致调整或取消；E&B 会在出发前再次确认。"],h:["南滨路散步 → 长嘉汇晚餐 → 表演","视人流与管制安排较正面的观看角度","临行前再次确认官方场次"]},
      "night-view":{title:"纯粹的重庆夜景",season:"晴朗夜晚",tags:["天际线","晚餐","两江"],p:["不看无人机时，夜晚反而可以更安静从容。可在南滨路或精选半山观景位置用餐，把注意力完整留给两江与亮灯后的天际线。","优势在于灵活：根据能见度选择最佳角度、避开最大人潮，也不必追赶固定表演时间。"],h:["比表演夜更从容的选择","南滨路或半山观景角度用餐","可根据天气与人流灵活调整"]},
      "eling-panorama":{title:"鹅岭栈道与瞰胜楼",season:"晴朗黄昏前",tags:["全景","日落","轻松步行"],p:["从半山崖栈道走到瞰胜楼，鹅岭提供了最容易读懂重庆的角度之一：两江、山脊、桥梁与高楼终于连成一幅完整地景。","日落前最后一段光尤其漂亮，而且前景仍有公园生活，不会像封闭观景台那样只剩一幅远景。"],h:["更温和、舒适的天际线选择","最好在日落前抵达","可与二厂和俯瞰李子坝组合"]},
      raffles:{title:"来福士云端漫步",season:"晴朗且风小",tags:["高空","刺激体验","现代天际线"],p:["在两江交汇上空走出来福士高空路线，近距离感受重庆天际线；全程配备安全带、专业装备，并由工作人员指导。","这是菜单里最刺激的选择：时间短、控制完善，适合真正享受高度与临空感的客人。"],h:["完整安全装备与工作人员看护","适合不惧高、喜欢刺激的客人","受天气影响，可替换为更温和的观景方案"]},
      luohan:{title:"罗汉寺与一杯咖啡",season:"全年",tags:["建筑","佛教","古今对照"],p:["走进一座几乎藏在市中心高楼之间、至今仍在运作的佛寺。香火、石刻与小院落，在重庆最立体的商业区里形成突然安静的一段。","随后在附近喝杯咖啡，慢慢讨论信仰与商业、历史与现代城市如何在几条街内共存。"],h:["古老寺院与现代高楼的对照鲜明","时间紧凑，容易纳入市中心行程","看完后用一杯咖啡留出理解与讨论的时间"]},
      dazu:{title:"大足石刻：先理解，再见真迹",season:"春秋最佳",tags:["世界遗产","佛教艺术","全天"],p:["先观看两部数字影像：8K 球幕放大石刻细节与整体空间；4K 宽银幕介绍历史与开凿过程。","随后参观博物馆，最后进入宝顶山面对真迹。对国际客人而言，“影像 → 脉络 → 真迹”的次序，能把一大片石刻转化为真正读得懂的故事。"],h:["8K 球幕 → 4K 历史影片 → 博物馆 → 宝顶山真迹","以理解与解读为核心的完整一天","特别适合第一次接触石刻的国际客人"]},
      wulong:{title:"武隆天生三桥与乌江",season:"4–6 月 · 9–11 月",tags:["喀斯特地貌","自然","全天"],p:["用完整一天进入武隆天生三桥。巨型石灰岩天桥、天坑与深绿崖壁，会让人在地貌面前突然感受到自身尺度。","路线与天气允许时，途中加停涪陵乌江观景台，让从大都会进入地质世界的转换本身也成为体验。"],h:["天生三桥是全天主角","条件合适时顺路加入涪陵乌江观景台","车程与步行都较多，是完整长日"]},
      beibei:{title:"北碚：从缙云山到温泉",season:"秋季至春季",tags:["山林","温泉","古镇"],p:["乘缆车进入缙云山绿坡，再从北温泉的历史延伸到精致的柏联温泉体验，理解北碚与疗愈之水的长期关系。","最后走入金刚碑古镇的石巷与江畔记忆。全天刻意保持平衡：山林、地方历史，再以不赶时间的温泉收尾。"],h:["缙云山缆车","北温泉历史与柏联温泉体验","金刚碑古镇的质感与地方记忆"]}

    function formatResponse(){const items=experiences.filter(e=>selected.has(e.id));const guest=guestName.value.trim()||"Jackie",note=selectionNote.value.trim();const title=UI[lang].shortlistTitle;const lines=[title,`${UI[lang].guestLabel}: ${guest}`,"",...items.map(e=>`${experienceCode(e)} · ${e.title[lang]} (${e.d})`)];if(note)lines.push("",`${UI[lang].notesLabel}: ${note}`);return lines.join("\n")}
    async function copyResponseText(){const text=formatResponse();try{await navigator.clipboard.writeText(text)}catch(error){const helper=document.createElement("textarea");helper.className="screen-reader-copy";helper.value=text;document.body.appendChild(helper);helper.select();document.execCommand("copy");helper.remove()}responseFeedback.textContent=UI[lang].copied}
    async function shareResponseText(){const text=formatResponse();if(navigator.share){try{await navigator.share({title:UI[lang].shortlistTitle,text});return}catch(error){if(error.name==="AbortError")return}}await copyResponseText()}
    function setLanguage(l){const openId=current;lang=l;renderUI();renderTabs();renderTheme();if(openId)openModal(openId)}
    document.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>setLanguage(b.dataset.lang));closeBtn.onclick=closeModal;modal.onclick=e=>{if(e.target===modal)closeModal()};document.getElementById("openShortlist").onclick=openShortlistDialog;shortlistClose.onclick=closeShortlistDialog;shortlistOverlay.onclick=e=>{if(e.target===shortlistOverlay)closeShortlistDialog()};responseForm.onsubmit=e=>{e.preventDefault();copyResponseText()};shareResponse.onclick=shareResponseText;document.onkeydown=e=>{if(e.key==="Escape"&&shortlistOverlay.classList.contains("open")){closeShortlistDialog();return}if(e.key==="Escape"&&modal.classList.contains("open")){closeModal();return}if(!modal.classList.contains("open")&&document.activeElement?.classList.contains("theme-tab")&&(e.key==="ArrowRight"||e.key==="ArrowLeft")){switchTheme((theme+(e.key==="ArrowRight"?1:-1)+7)%7);setTimeout(()=>tabs.querySelector(".active")?.focus(),190)}};renderUI();renderTabs();renderTheme();
  </script>
</body>
